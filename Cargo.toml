[package]
name = "phoenix"
version = "0.1.0"
edition = "2024"

[workspace]
members = [ "crates/*" ]
resolver = "2"

[dependencies]
phoenix-ast = { path = "crates/phoenix-ast" }
phoenix-parser = { path = "crates/phoenix-parser" }
phoenix-type = { path = "crates/phoenix-type" }
phoenix-anf = { path = "crates/phoenix-anf" }
phoenix-closure = { path = "crates/phoenix-closure" }
